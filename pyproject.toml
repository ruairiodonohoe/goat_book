[build-system] # https://docs.astral.sh/uv/concepts/build-backend/
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[project] # https://packaging.python.org/en/latest/specifications/pyproject-toml/
name = "goat_book"
version = "0.0.0"
description = "Demo book TDD"
readme = "README.md"
authors = [{ name = "Ruairi O'Donohoe", email = "ruairiodonohoe@gmail.com" }]
requires-python = ">=3.14,<4.0"
dependencies = [
  "ansible>=14.3.1",
  "django<7",
  "docker>=7.2.0",
  "dotenv>=0.9.9",
  "gunicorn>=26.2.0",
  "lxml[cssselect]>=6.1.2",
  "poethepoet (>=0.48.0)",
  "pytest>=9.1.1",
  "pytest-django>=4.14.0",
  "selenium>=4.47.0",
  "whitenoise>=6.12.0",
]

[project.urls] # https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
homepage = "https://github.com/ruairiodonohoe/goat_book"
source = "https://github.com/ruairiodonohoe/goat_book"
releasenotes = "https://github.com/ruairiodonohoe/goat_book/releases"
documentation = "https://ruairiodonohoe.github.io/goat_book"
issues = "https://github.com/ruairiodonohoe/goat_book/issues"

[dependency-groups] # https://docs.astral.sh/uv/concepts/projects/dependencies/#development-dependencies
dev = [
  "codespell (>=2.4.3)",
  "coverage[toml] (>=7.15.4)",
  "django-stubs>=6.1.0",
  "ipykernel (>=7.3.0)",
  "ipython (>=9.16.1)",
  "ipywidgets (>=8.1.8)",
  "mkdocs-material (>=9.7.7)",
  #"pre-commit (>=4.0.1)",
  "prek>=0.4.13",
  "pytest (>=9.1.1)",
  "pytest-mock (>=3.15.1)",
  "pytest-xdist (>=3.8.0)",
  "ruff (>=0.16.3)",
  "ty (>=0.0.71)",
  "typeguard (>=4.6.0)",
]

[tool.uv]
package = false

[tool.codespell] # https://github.com/codespell-project/codespell
builtin = "en-GB_to_en-US,clear,code,rare"
check-filenames = true
skip = "./*_cache/,./.venv,./reports,./src/lists/static/bootstrap/*,./static/bootstrap/*,./static/admin"
ignore-words-list = "assertIn"

[tool.coverage.report] # https://coverage.readthedocs.io/en/latest/config.html#report
#fail_under = 50
fail_under = 0
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.run] # https://coverage.readthedocs.io/en/latest/config.html#run
branch = true
command_line = "--module pytest"
data_file = "reports/.coverage"
source = ["src"]

[tool.coverage.xml] # https://coverage.readthedocs.io/en/latest/config.html#xml
output = "reports/coverage.xml"

[tool.pytest.ini_options] # https://docs.pytest.org/en/latest/reference/reference.html#ini-options-ref
addopts = "--color=yes --doctest-modules --exitfirst --failed-first --strict-config --strict-markers --verbosity=2 --junitxml=reports/pytest.xml"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore:Implicitly cleaning up.*:ResourceWarning",
]
testpaths = ["src", "functional_tests"]
xfail_strict = true
DJANGO_SETTINGS_MODULE = "superlists.settings"
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py", "tests.py"]

[tool.ruff] # https://docs.astral.sh/ruff/settings/
fix = true
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY",
  "FIX",
  "ARG001",
  "COM812",
  "D203",
  "D213",
  "E501",
  "PD008",
  "PD009",
  "RET504",
  "S101",
  "TD003",
  "PT",     # Temporary, PyTest
]
unfixable = ["ERA001", "F401", "F841", "T201", "T203"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"manage.py" = [
  "PLC0415", # import outside toplevel
  "TRY003",  # avoid-specify-long-message-in-exception
  "EM101",   # Exception must not use a string literal, assign to variable first
]
"**/migrations/*.py" = [
  "D100",   # Missing docstring in public module
  "D101",   # Missing docstring in public class
  "D102",   # Missing docstring in public method
  "D103",   # Missing docstring in public function
  "D104",   # Missing docstring in public package
  "RUF012", # Mutable default value for class attribute
]

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.ty.terminal]
error-on-warning = true

[tool.poe.executor] # https://github.com/nat-n/poethepoet
type = "simple"

[tool.poe.tasks]

[tool.poe.tasks.docs]
help = "Build or serve the documentation"
shell = """
    if [ $serve ]
    then {
      mkdocs serve
    } else {
      mkdocs build
    } fi
    """

[[tool.poe.tasks.docs.args]]
help = "Serve the documentation locally with live reload"
type = "boolean"
name = "serve"
options = ["--serve"]

[tool.poe.tasks.serve]
help = "Serve the app"

[[tool.poe.tasks.serve.sequence]]
cmd = "echo 'Serving app (placeholder)...'"

[tool.poe.tasks.lint]
help = "Lint this app"
# cmd = """
#     pre-commit run
#       --all-files
#       --color always
#     """
cmd = """
    prek run
      --all-files
      --color always
    """

[tool.poe.tasks.test]
help = "Test this app"

[[tool.poe.tasks.test.sequence]]
cmd = "coverage run"

[[tool.poe.tasks.test.sequence]]
cmd = "coverage report"

[[tool.poe.tasks.test.sequence]]
cmd = "coverage xml"
