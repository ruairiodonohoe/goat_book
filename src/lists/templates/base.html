<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
              content="A to-do list application to manage your tasks">
        <link href="/static/bootstrap/css/bootstrap.min.css" rel="stylesheet">
        <title>To-Do lists</title>
    </head>
    <body>
        <div class="container">
            <div class="row justify-content-center p-5 bg-body-tertiary rounded-3">
                <div class="col-lg-6 text-center">
                    <h1 class="display-1 mb-4">
                        {% block header_text %}{% endblock %}
                    </h1>
                    <form method="post" action="{% block form_action %}{% endblock %}">
                        <!-- {{ form.text }} -->
                        {% csrf_token %}
                        <input id="id_text"
                               name="text"
                               class="form-control form-control-lg {% if form.errors %}is-invalid{% endif %}"
                               placeholder="Enter a to-do item"
                               value="{{ form.text.value | default:'' }}"
                               aria-describedby="id_text_feedback"
                               required>
                        {% if form.errors %}
                            <!-- <div class="invalid-feedback">{{ form.errors.text }}</div> -->
                            <div id="id_text_feedback" class="invalid-feedback">{{ form.errors.text.0 }}</div>
                        {% endif %}
                    </form>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    {% block table %}{% endblock %}
                </div>
            </div>
        </div>
    </body>
</html>
