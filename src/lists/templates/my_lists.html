{% extends 'base.html' %}
{% block header_text %}
    <span class="d-inline-block text-break fs-1">{{ user.email }}'s Lists</span>
{% endblock %}
{% block content %}
    <h2>{{ owner.email }}'s lists</h2>
    <ul>
        {% for list in owner.lists.all %}
            <li><a href="{{ list.get_absolute_url }}">{{ list.name }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}
